// 密碼閘門（僅擋一般不相關人員誤開，前端密碼看得到原始碼，不是真資安防護）
(function(){
  const SITE_PASSWORD='3345678';
  const AUTH_KEY='mk_auth_meibao_backoffice';
  if(localStorage.getItem(AUTH_KEY)==='1')return;
  const gate=document.createElement('div');
  gate.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9999;font-family:-apple-system,"Microsoft JhengHei",sans-serif';
  gate.innerHTML=`
    <div style="background:#fff;border-radius:14px;padding:32px 28px;width:300px;box-shadow:0 8px 32px rgba(0,0,0,.28);text-align:center">
      <div style="width:52px;height:52px;border-radius:50%;background:#FFF0E8;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:24px">🔒</div>
      <div style="font-size:15px;font-weight:500;color:#222;margin-bottom:2px">美寶美食館POS後台</div>
      <div style="font-size:11px;color:#888;margin-bottom:20px">輸入通行密碼繼續使用（美寶美食館POS後台）</div>
      <input type="password" id="gate-pw" placeholder="通行密碼" style="width:100%;box-sizing:border-box;padding:11px 14px;border:1px solid #e0e0e0;border-radius:8px;font-size:13px;text-align:center;margin-bottom:6px;outline:none">
      <div id="gate-err" style="font-size:10px;color:#A32D2D;min-height:16px;margin-bottom:10px"></div>
      <button id="gate-btn" style="width:100%;background:#e8632c;color:#fff;border:none;padding:11px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer">確定</button>
      <div style="font-size:10px;color:#aaa;margin-top:16px">忘記請聯繫老闆</div>
    </div>`;
  document.body.appendChild(gate);
  function trySubmit(){
    const val=document.getElementById('gate-pw').value;
    if(val===SITE_PASSWORD){
      localStorage.setItem(AUTH_KEY,'1');
      gate.remove();
    }else{
      document.getElementById('gate-err').textContent='密碼錯誤，請再試一次';
      document.getElementById('gate-pw').value='';
      document.getElementById('gate-pw').focus();
    }
  }
  document.getElementById('gate-btn').onclick=trySubmit;
  document.getElementById('gate-pw').addEventListener('keydown',e=>{if(e.key==='Enter')trySubmit();});
  document.getElementById('gate-pw').focus();
})();
</script>

function switchBackofficeTab(name) {
  document.getElementById('tab-btn-availability').classList.toggle('active', name === 'availability');
  document.getElementById('view-availability').style.display = name === 'availability' ? 'block' : 'none';
}

let tabletStatusMap = {};   // 雲端平板/線上點餐共用狀態，key=品項名稱
let posStatusMap = {};      // POS功能獨立狀態，key=分類||品項名稱

function loadAvailability() {
  document.getElementById('availability-list').innerHTML = '<div class="empty-hint">載入中...</div>';
  return Promise.all([
    apiGet({ action: 'storeStatus', storeId: 'meibao' }),
    apiGet({ action: 'posItemStatus' })
  ]).then(([storeData, posData]) => {
    tabletStatusMap = (storeData.status === 'ok' && storeData.items) ? storeData.items : {};
    posStatusMap = (posData.status === 'ok' && posData.items) ? posData.items : {};
    renderAvailabilityList();
  }).catch(() => {
    document.getElementById('availability-list').innerHTML = '<div class="empty-hint">載入失敗，請確認網路連線後重新整理頁面</div>';
  });
}

function posStatusKey(cat, name) { return cat + '||' + name; }

function renderAvailabilityList() {
  const listEl = document.getElementById('availability-list');
  listEl.innerHTML = '';
  let lastCat = null;
  ITEM_LIST.forEach(it => {
    if (it.category !== lastCat) {
      const catTitle = document.createElement('div');
      catTitle.className = 'cat-title';
      catTitle.textContent = it.category;
      listEl.appendChild(catTitle);
      lastCat = it.category;
    }
    const tabletCurrent = tabletStatusMap[it.name] || '供應中';
    const posCurrent = posStatusMap[posStatusKey(it.category, it.name)] || '供應中';

    const row = document.createElement('div');
    row.className = 'item-row';
    row.innerHTML = `<span class="name">${it.name}</span>`;

    const controls = document.createElement('div');
    controls.className = 'controls';

    const tabletGroup = document.createElement('div');
    tabletGroup.className = 'control-group';
    tabletGroup.innerHTML = '<span class="label">雲端平板／線上點餐</span>';
    const tabletSelect = buildStatusSelect(tabletCurrent, (val) => {
      apiPost({ action: 'setItemStatus', name: it.name, status: val })
        .catch(err => console.warn('雲端平板狀態同步失敗', err));
      tabletStatusMap[it.name] = val === '供應中' ? undefined : val;
    });
    tabletGroup.appendChild(tabletSelect);

    const posGroup = document.createElement('div');
    posGroup.className = 'control-group';
    posGroup.innerHTML = '<span class="label">POS功能</span>';
    const posSelect = buildStatusSelect(posCurrent, (val) => {
      apiPost({ action: 'setPosItemStatus', category: it.category, name: it.name, status: val })
        .catch(err => console.warn('POS功能狀態同步失敗', err));
      posStatusMap[posStatusKey(it.category, it.name)] = val === '供應中' ? undefined : val;
    });
    posGroup.appendChild(posSelect);

    controls.appendChild(tabletGroup);
    controls.appendChild(posGroup);
    row.appendChild(controls);
    listEl.appendChild(row);
  });
}

function buildStatusSelect(current, onChange) {
  const select = document.createElement('select');
  ['供應中', '本日售完', '永久下架'].forEach(opt => {
    const optEl = document.createElement('option');
    optEl.value = opt;
    optEl.textContent = opt;
    if (opt === current) optEl.selected = true;
    select.appendChild(optEl);
  });
  select.onchange = () => onChange(select.value);
  return select;
}

loadAvailability();
