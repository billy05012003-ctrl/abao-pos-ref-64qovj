<style>

  body { margin:0; font-family:-apple-system,"Microsoft JhengHei",sans-serif; background:var(--bg); color:#222; height:100vh; overflow:hidden; display:flex; flex-direction:column; }

  .pos-grid-card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:8px; text-align:center; cursor:pointer; display:flex; flex-direction:column; justify-content:space-between; }

  .btn { border:none; border-radius:8px; padding:10px 14px; font-size:0.9rem; font-weight:600; cursor:pointer; }

  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }

  .empty-hint { color:#999; font-size:0.85rem; text-align:center; padding:12px 0; }
  .refresh-link { font-size:0.8rem; color:#888; text-decoration:underline; cursor:pointer; }
  /* 分類手風琴列表（比照POS後台一致的樣式，2026-09-13新增：雲端平板整併進POS功能後，
     品項上下架清單分類也改成可摺疊，不再整頁一路往下捲） */
  .mc-accordion-row { background:#fff; border:1px solid var(--border); border-radius:8px; margin-bottom:8px; overflow:hidden; }
  .mc-accordion-header { display:flex; align-items:center; gap:6px; padding:2px 8px; }
  .mc-accordion-toggle { flex:1; min-width:0; text-align:left; border:none; background:none; padding:10px 6px; font-size:0.92rem; font-weight:600; cursor:pointer; color:#222; display:flex; align-items:center; gap:6px; }
  .mc-accordion-caret { color:var(--muted); font-size:0.7rem; width:12px; display:inline-block; flex:0 0 auto; }
  .mc-accordion-body { border-top:1px solid var(--border); padding:6px 10px 10px 20px; }
  .mc-accordion-item-row { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 0; border-bottom:1px solid #f0f0f0; font-size:0.85rem; flex-wrap:wrap; }

<script>
if(new Date()>new Date('2026-12-31T23:59:59')){
  document.body.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f5f5f5;font-family:'Microsoft JhengHei',sans-serif;text-align:center;padding:20px">
    <div style="background:#fff;border-radius:12px;padding:40px 30px;box-shadow:0 2px 12px rgba(0,0,0,0.1);max-width:420px">
      <div style="font-size:40px;margin-bottom:12px">⏳</div>
      <div style="font-size:16px;font-weight:700;margin-bottom:8px;color:#333">此版本已過期</div>
      <div style="font-size:12px;color:#666;line-height:1.7">「美寶美食館POS功能」預覽期限至 2026/12/31。<br>請聯繫小保取得新版本後再繼續使用。</div>
    </div>
  </div>`;
  document.title='已過期 - 美寶美食館POS功能';
  throw new Error('此版本已過期（適用至2026/12/31），請聯繫小保取得新版本');
}
// 密碼閘門（僅擋一般不相關人員誤開，前端密碼看得到原始碼，不是真資安防護）
(function(){
  const SITE_PASSWORD='3345678';
  const AUTH_KEY='mk_auth_meibao_tablet';
  if(localStorage.getItem(AUTH_KEY)==='1')return;
  const gate=document.createElement('div');
  gate.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9999;font-family:-apple-system,"Microsoft JhengHei",sans-serif';
  gate.innerHTML=`
    <div style="background:#fff;border-radius:14px;padding:32px 28px;width:300px;box-shadow:0 8px 32px rgba(0,0,0,.28);text-align:center">
      <div style="width:52px;height:52px;border-radius:50%;background:#FFF0E8;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:24px">🔒</div>
      <div style="font-size:15px;font-weight:500;color:#222;margin-bottom:2px">POS功能</div>
      <div style="font-size:11px;color:#888;margin-bottom:20px">輸入通行密碼繼續使用（美寶美食館POS功能）</div>
      <input type="password" id="gate-pw" placeholder="通行密碼" style="width:100%;box-sizing:border-box;padding:11px 14px;border:1px solid #e0e0e0;border-radius:8px;font-size:13px;text-align:center;margin-bottom:6px;outline:none">
      <div id="gate-err" style="font-size:10px;color:#A32D2D;min-height:16px;margin-bottom:10px"></div>
      <button id="gate-btn" style="width:100%;background:#e8632c;color:#fff;border:none;padding:11px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer">確定</button>
      <div style="font-size:10px;color:#aaa;margin-top:16px">忘記請聯繫老闆</div>
    </div>`;
  document.body.appendChild(gate);
  function trySubmit(){
    const val=document.getElementById('gate-pw').value;
    if(val===SITE_PASSWORD){
      localStorage.setItem(AUTH_KEY,'1');
      gate.remove();
    }else{
      document.getElementById('gate-err').textContent='密碼錯誤，請再試一次';
      document.getElementById('gate-pw').value='';
      document.getElementById('gate-pw').focus();
    }
  }
  document.getElementById('gate-btn').onclick=trySubmit;
  document.getElementById('gate-pw').addEventListener('keydown',e=>{if(e.key==='Enter')trySubmit();});
  document.getElementById('gate-pw').focus();
})();
</script>

// 2026-09-02新增：後端doGet/doPost入口統一擋appKey，這裡自動帶上，兩個入口只改這一處，
// 之後不管POS功能繼續加什麼新API都會自動套用，不用每次補強都想一次
const APP_KEY = 'abao-meibao-2026';
function apiGet(params) {
  const qs = new URLSearchParams({ ...params, appKey: APP_KEY }).toString();
  return fetch(`${ORDER_BACKEND_URL}?${qs}`).then(r => r.json());
}
function apiPost(payload) {
  return fetch(ORDER_BACKEND_URL, { method: 'POST', body: JSON.stringify({ ...payload, appKey: APP_KEY }) }).then(r => r.json());
}

let currentStoreStatus = { busy: false, paused: false, items: {} };

function refreshStatusBanner() {
  const banner = document.getElementById('status-banner');
  if (currentStoreStatus.paused) {
    banner.className = 'status-banner status-paused';
    banner.textContent = '⛔ 暫停接單中';
  } else if (currentStoreStatus.busy) {
    banner.className = 'status-banner status-busy';
    banner.textContent = '⚠️ 忙碌中（線上點餐每' + (currentStoreStatus.busyIntervalMinutes || 0) + '分鐘限接1張新單，不影響現場POS點餐）';
  } else {
    banner.className = 'status-banner status-ok';
    banner.textContent = '✅ 正常供餐中';
  }
  document.getElementById('busy-btn').textContent = currentStoreStatus.busy ? '取消忙碌' : '設為忙碌';
  document.getElementById('pause-btn').textContent = currentStoreStatus.paused ? '恢復接單' : '暫停接單';
}

function loadStoreStatus() {
  return apiGet({ action: 'storeStatus', storeId: STORE_ID }).then(data => {
    if (data.status !== 'ok') return;
    currentStoreStatus = data;
    refreshStatusBanner();
  });
}

function onBusyClick() {
  if (currentStoreStatus.busy) {
    apiPost({ action: 'clearBusy', storeId: STORE_ID }).then(loadStoreStatus);
  } else {
    const minutes = document.getElementById('busy-minutes').value;
    apiPost({ action: 'setBusy', storeId: STORE_ID, minutes: Number(minutes) }).then(loadStoreStatus);
  }
}

function onPauseClick() {
  if (currentStoreStatus.paused) {
    apiPost({ action: 'clearPause', storeId: STORE_ID }).then(loadStoreStatus);
  } else {
    const minutes = document.getElementById('pause-minutes').value;
    apiPost({ action: 'setPause', storeId: STORE_ID, minutes: Number(minutes) }).then(loadStoreStatus);
  }
}

function loadRevenue() {
  apiGet({ action: 'todayRevenue', storeId: STORE_ID }).then(data => {
    if (data.status !== 'ok') return;
    document.getElementById('revenue-total').textContent = `$${data.total}`;
    document.getElementById('revenue-count').textContent = `今日 ${data.count} 筆已付款訂單`;
  });
}

function loadOrders() {
  apiGet({ action: 'todayOrders', storeId: STORE_ID }).then(data => {
    if (data.status !== 'ok') return;
    const container = document.getElementById('orders-list');
    if (data.orders.length === 0) {
      container.innerHTML = '<div class="empty-hint">目前沒有待取餐訂單</div>';
      return;
    }
    container.innerHTML = data.orders.map(o => `
      <div class="order-card">
        <div>
          <div><strong>${o.orderId}</strong></div>
          <div class="meta">取餐時間 ${o.pickupTime}　$${o.totalAmount}</div>
        </div>
        <button class="btn btn-primary" onclick="markReady('${o.orderId}')">可以取餐</button>
      </div>
    `).join('');
  });
}

function markReady(orderId) {
  apiPost({ action: 'markPickupReady', orderId: orderId }).then(() => {
    loadOrders();
    loadRevenue();
  });
}

function buildAvailSelect_(current, onChange) {
  const select = document.createElement('select');
  ['供應中', '本日售完', '永久下架'].forEach(opt => {
    const optEl = document.createElement('option');
    optEl.value = opt;
    optEl.textContent = opt;
    if (opt === current) optEl.selected = true;
    select.appendChild(optEl);
  });
  select.onchange = () => onChange(select.value, select);
  return select;
}

// 2026-09-13新增：原本「雲端平板」分頁的品項狀態清單(renderItemsList)跟POS功能自己的品項上下架
// (renderPosLocalItemStatusManager)合併成一份，分類改手風琴摺疊，每個品項同時顯示兩個獨立開關，
// 呈現方式對齊POS後台的「品項上下架」頁面
let itemStatusExpandedCats = new Set();

function renderMergedItemStatusList() {
  const container = document.getElementById('pos-item-status-list');
  container.innerHTML = '';
  const overrides = currentStoreStatus.items || {};
  const grouped = new Map();
  ITEM_LIST.forEach(it => {
    if (!grouped.has(it.category)) grouped.set(it.category, []);
    grouped.get(it.category).push(it);
  });
  grouped.forEach((items, cat) => {
    const expanded = itemStatusExpandedCats.has(cat);
    const row = document.createElement('div');
    row.className = 'mc-accordion-row';

    const header = document.createElement('div');
    header.className = 'mc-accordion-header';
    const toggleBtn = document.createElement('button');
    toggleBtn.type = 'button';
    toggleBtn.className = 'mc-accordion-toggle';
    const displayCat = cat === POS_LOCAL_ADDON_STATUS_CATEGORY ? cat : shortCatName(cat);
    toggleBtn.innerHTML = `<span class="mc-accordion-caret">${expanded ? '▼' : '▶'}</span><span>${displayCat}</span><span style="color:var(--muted);font-size:0.78rem;">(${items.length})</span>`;
    toggleBtn.onclick = () => {
      if (expanded) itemStatusExpandedCats.delete(cat); else itemStatusExpandedCats.add(cat);
      renderMergedItemStatusList();
    };
    header.appendChild(toggleBtn);
    row.appendChild(header);

    if (expanded) {
      const body = document.createElement('div');
      body.className = 'mc-accordion-body';
      items.forEach(it => {
        const tabletCurrent = overrides[it.name] || '供應中';
        const posCurrent = getPosLocalItemStatus(it.category, it.name) || '供應中';

        const itemRow = document.createElement('div');
        itemRow.className = 'mc-accordion-item-row';
        itemRow.innerHTML = `<span class="name">${it.name}</span>`;

        const controls = document.createElement('div');
        controls.className = 'controls';

        const tabletGroup = document.createElement('div');
        tabletGroup.className = 'control-group';
        tabletGroup.innerHTML = '<span class="label">雲端平板／線上點餐</span>';
        const tabletSelect = buildAvailSelect_(tabletCurrent, (val, selectEl) => {
          const previous = tabletCurrent;
          if (!currentStoreStatus.items) currentStoreStatus.items = {};
          currentStoreStatus.items[it.name] = val === '供應中' ? undefined : val;
          apiPost({ action: 'setItemStatus', name: it.name, status: val })
            .then(data => { if (data.status !== 'ok') throw new Error(data.message || '寫入失敗'); })
            .catch(err => {
              console.warn('雲端平板/線上點餐狀態同步失敗', err);
              currentStoreStatus.items[it.name] = previous === '供應中' ? undefined : previous;
              selectEl.value = previous;
              alert(`「${it.name}」雲端平板／線上點餐狀態同步失敗，請確認網路連線後重試(畫面已還原)`);
            });
        });
        tabletGroup.appendChild(tabletSelect);

        const posGroup = document.createElement('div');
        posGroup.className = 'control-group';
        posGroup.innerHTML = '<span class="label">POS功能</span>';
        const posSelect = buildAvailSelect_(posCurrent, val => setPosLocalItemStatus(it.category, it.name, val));
        posGroup.appendChild(posSelect);

        controls.appendChild(tabletGroup);
        controls.appendChild(posGroup);
        itemRow.appendChild(controls);
        body.appendChild(itemRow);
      });
      row.appendChild(body);
    }
    container.appendChild(row);
  });
}

// ---------------------------------------------------------------
// 兌換券系統：查詢會員後載入其兌換券清單+集點兌換目錄+店員手動贈送按鈕
// ---------------------------------------------------------------
function loadMemberVouchers() {
  if (!selectedMember) return;
  apiGet({ action: 'getMemberVouchers', phone: selectedMember.phone }).then(data => {
    memberVouchers = (data.status === 'ok') ? data.vouchers : [];
    renderMemberVoucherPanel();
  });
}

function renderMemberVoucherPanel() {
  const panel = document.getElementById('member-voucher-panel');
  if (!panel || !selectedMember) return;

  const appliedIds = new Set(appliedVouchers.map(v => v.voucherId));
  const usable = memberVouchers.filter(v => v.usable && !appliedIds.has(v.voucherId));
  const usableHtml = usable.length
    ? usable.map(v => `
        <div style="display:flex;align-items:center;justify-content:space-between;padding:4px 0;font-size:0.8rem;">
          <span>${v.type}<span style="color:var(--muted);font-size:0.72rem;">（${v.source}）</span></span>
          <button class="btn" style="padding:3px 8px;font-size:0.76rem;" onclick="selectVoucherToApply('${v.voucherId}','${v.type}')">使用</button>
        </div>`).join('')
    : '<div style="color:var(--muted);font-size:0.78rem;">目前無可用兌換券</div>';

  const redeemableHtml = POINT_REDEMPTION_CATALOG.map(entry => {
    const enough = selectedMember.points >= entry.points;
    return `
      <div style="display:flex;align-items:center;justify-content:space-between;padding:3px 0;font-size:0.78rem;${enough ? '' : 'opacity:0.5;'}">
        <span>${entry.points}點 → ${entry.voucherType}</span>
        <button class="btn" style="padding:2px 7px;font-size:0.74rem;" ${enough ? '' : 'disabled'} onclick="redeemPointsForVoucher('${entry.voucherType}')">兌換</button>
      </div>`;
  }).join('');

  const grantHtml = MANUAL_GRANT_VOUCHER_TYPES.map(type => `
    <button class="btn" style="padding:4px 8px;font-size:0.76rem;margin:2px 4px 2px 0;" onclick="grantVoucherToMember('${type}')">贈送：${type}</button>
  `).join('');

  panel.innerHTML = `
    <div style="margin-top:8px;border-top:1px dashed var(--border);padding-top:6px;">
      <div style="font-size:0.8rem;font-weight:600;color:var(--muted);margin-bottom:2px;">目前可用兌換券</div>
      ${usableHtml}
    </div>
    <div style="margin-top:8px;border-top:1px dashed var(--border);padding-top:6px;">
      <div style="font-size:0.8rem;font-weight:600;color:var(--muted);margin-bottom:2px;">集點兌換</div>
      ${redeemableHtml}
    </div>
    <div style="margin-top:8px;border-top:1px dashed var(--border);padding-top:6px;">
      <div style="font-size:0.8rem;font-weight:600;color:var(--muted);margin-bottom:4px;">店員贈送兌換券</div>
      ${grantHtml}
    </div>
  `;
}

function grantVoucherToMember(type) {
  if (!selectedMember) { alert('請先查詢/選擇會員'); return; }
  apiPost({ action: 'grantVoucher', phone: selectedMember.phone, type: type }).then(data => {
    if (data.status !== 'ok') { alert(data.message || '贈送失敗'); return; }
    alert(`已贈送「${type}」給${selectedMember.name}`);
    loadMemberVouchers();
  });
}

function redeemPointsForVoucher(voucherType) {
  if (!selectedMember) return;
  apiPost({ action: 'redeemPoints', phone: selectedMember.phone, voucherType: voucherType }).then(data => {
    if (data.status !== 'ok') { alert(data.message || '兌換失敗'); return; }
    selectedMember.points = data.remainingPoints;
    alert(`已兌換「${voucherType}」，剩餘點數 ${data.remainingPoints}`);
    loadMemberVouchers();
  });
}

// 選定一張兌換券要套用在這筆訂單：fixed類直接套用扣總金額；item類要再選購物車裡哪一項
// 可複選多張兌換券疊加套用，同一張券用過後會從「可用」清單移除，不能重複套用
function selectVoucherToApply(voucherId, type) {
  const behavior = VOUCHER_BEHAVIOR[type];
  if (!behavior) { alert('未知的兌換券類型：' + type); return; }
  if (behavior.mode === 'fixed') {
    appliedVouchers.push({ voucherId, type, mode: 'fixed', discountAmount: behavior.amount });
    renderPosCart();
    renderMemberVoucherPanel();
    alert(`已套用「${type}」，結帳金額折抵 $${behavior.amount}`);
  } else {
    if (posCart.length === 0) { alert('購物車是空的，請先選購要套用兌換券的品項'); return; }
    pendingVoucherForItemPick = { voucherId, type, effect: behavior.effect, minQty: behavior.minQty };
    showVoucherItemPicker();
  }
}

function showVoucherItemPicker() {
  const listEl = document.getElementById('pos-voucher-picker-list');
  listEl.innerHTML = posCart.map(c => `
    <button class="btn" style="display:block;width:100%;text-align:left;margin-bottom:6px;padding:8px 10px;" onclick="applyVoucherToLine('${c.lineKey}')">
      ${c.name}${c.size ? ' ('+c.size+')' : ''}　$${c.price} x ${c.qty}
    </button>
  `).join('');
  document.getElementById('pos-voucher-picker-title').textContent = '套用「' + pendingVoucherForItemPick.type + '」於哪個品項？';
  document.getElementById('pos-voucher-picker-overlay').classList.add('open');
}

function closeVoucherItemPicker() {
  document.getElementById('pos-voucher-picker-overlay').classList.remove('open');
  pendingVoucherForItemPick = null;
}

// 跨列合併資格判斷（2026-09-03新增）：同一基本品項(不管客製化不同)分成好幾條購物車列時，
// 加總全部列的數量一起判斷夠不夠件數，不再只看被選中那一列自己的qty
function getPosCartQtyForBaseName(baseName) {
  return posCart.filter(c => c.baseName === baseName).reduce((s, c) => s + c.qty, 0);
}

function applyVoucherToLine(lineKey) {
  const v = pendingVoucherForItemPick;
  if (!v) return;
  const line = posCart.find(c => c.lineKey === lineKey);
  if (!line) return;
  if (getPosCartQtyForBaseName(line.baseName) < v.minQty) { alert(`此品項需要有${v.minQty}件以上才能套用「${v.type}」`); return; }

  // 折抵只算基準價(客人選單點/升級套餐當下的整組價)，客製化加價一律不打折
  const base = line.basePrice != null ? line.basePrice : line.price;
  let discountAmount = 0;
  if (v.effect === 'free') {
    discountAmount = base;
  } else if (v.effect === 'discount60') {
    discountAmount = Math.round(base * 0.4); // 第二件六折＝其中一件折抵4成
  } else if (v.effect === 'discount50') {
    discountAmount = Math.round(base * 0.5); // 週二第二件五折＝其中一件折抵5成
  } else if (v.effect === 'addOne') {
    changePosQty(lineKey, 1); // 直接多加一件到購物車
    discountAmount = base - 1; // 這一件基準價部分只收$1，加購部分仍全額收
  }
  appliedVouchers.push({ voucherId: v.voucherId, type: v.type, mode: 'item', targetLineKey: lineKey, discountAmount: discountAmount });
  closeVoucherItemPicker();
  renderPosCart();
  renderMemberVoucherPanel();
  alert(`已套用「${v.type}」`);
}

// ---------------------------------------------------------------
// 門市活動直接折抵（POS按鈕，2026-09-03新增，改成左側「優惠券」分類點選觸發）：
// 跟上面兌換券系統分開，點了立刻套用、不呼叫後端grantVoucher、不產生任何兌換券記錄，不需要先查會員
// ---------------------------------------------------------------

// 活動飲品升級：跟上面折抵類按鈕相反，是加價，不用選購物車特定品項，直接加進總金額
// 用負數discountAmount代表加價，跟其他正數(折抵)共用同一個directDiscounts陣列+總額計算
function promptDrinkUpgrade() {
  if (posCart.length === 0) { alert('請先選購品項'); return; }
  const input = prompt('活動飲品升級，要加收多少元？');
  if (input === null) return;
  const amount = Number(input);
  if (!amount || amount <= 0 || !Number.isInteger(amount)) { alert('請輸入有效的正整數金額'); return; }
  directDiscounts.push({ type: '活動飲品升級', discountAmount: -amount });
  renderPosCart();
}

function applyDirectDiscount(type) {
  const behavior = VOUCHER_BEHAVIOR[type];
  if (!behavior) { alert('未知的折抵類型：' + type); return; }
  if (!behavior.autoAddChicken && posCart.length === 0) { alert('請先選購品項'); return; }
  if (behavior.mode === 'fixed') {
    directDiscounts.push({ type, discountAmount: behavior.amount });
    renderPosCart();
    return;
  }
  if (behavior.autoAddChicken) {
    // 週四雞塊免費：專屬折抵「雞塊 (4個)」，購物車沒有就自動加一份再折抵，不用店員自己選品項
    // 用baseName比對(而非name)，避免購物車已有客製化過的雞塊列(例如加辣)時誤判成沒有而重複新增
    let line = posCart.find(c => c.baseName === '雞塊 (4個)');
    if (!line) {
      line = { lineKey: '雞塊(4個)|free|', name: '雞塊 (4個)', baseName: '雞塊 (4個)', size: null, price: 35, basePrice: 35, qty: 1, note: '' };
      posCart.push(line);
    }
    applyDirectDiscountEffect_(type, behavior.effect, line.lineKey);
    return;
  }
  pendingDirectDiscount = { type, effect: behavior.effect, minQty: behavior.minQty };
  showDirectDiscountItemPicker();
}

function showDirectDiscountItemPicker() {
  const listEl = document.getElementById('pos-direct-picker-list');
  listEl.innerHTML = posCart.map(c => `
    <button class="btn" style="display:block;width:100%;text-align:left;margin-bottom:6px;padding:8px 10px;" onclick="applyDirectDiscountEffect_(pendingDirectDiscount.type, pendingDirectDiscount.effect, '${c.lineKey}')">
      ${c.name}${c.size ? ' ('+c.size+')' : ''}　$${c.price} x ${c.qty}
    </button>
  `).join('');
  document.getElementById('pos-direct-picker-title').textContent = '折抵「' + pendingDirectDiscount.type + '」於哪個品項？';
  document.getElementById('pos-direct-picker-overlay').classList.add('open');
}

function closeDirectDiscountItemPicker() {
  document.getElementById('pos-direct-picker-overlay').classList.remove('open');
  pendingDirectDiscount = null;
}

function applyDirectDiscountEffect_(type, effect, lineKey) {
  const behavior = VOUCHER_BEHAVIOR[type];
  const line = posCart.find(c => c.lineKey === lineKey);
  if (!line) return;
  if (behavior.minQty && getPosCartQtyForBaseName(line.baseName) < behavior.minQty) { alert(`此品項需要有${behavior.minQty}件以上才能套用「${type}」`); return; }

  // 折抵只算基準價(客人選單點/升級套餐當下的整組價)，客製化加價一律不打折
  const base = line.basePrice != null ? line.basePrice : line.price;
  let discountAmount = 0;
  if (effect === 'free') {
    discountAmount = base;
  } else if (effect === 'discount60') {
    discountAmount = Math.round(base * 0.4);
  } else if (effect === 'discount50') {
    discountAmount = Math.round(base * 0.5);
  } else if (effect === 'addOne') {
    changePosQty(lineKey, 1);
    discountAmount = base - 1;
  }
  directDiscounts.push({ type, discountAmount, targetLineKey: lineKey });
  closeDirectDiscountItemPicker();
  renderPosCart();
}

function clearDirectDiscount(index) {
  directDiscounts.splice(index, 1);
  renderPosCart();
}

function clearAppliedVoucher(voucherId) {
  appliedVouchers = appliedVouchers.filter(v => v.voucherId !== voucherId);
  renderPosCart();
  renderMemberVoucherPanel();
}

function rebuildDrinkComboDerivedData_() {
  DRINK_ITEM_CATEGORY = {};
  DRINK_FAMILY.forEach(cat => {
    (CATALOG[cat] || []).forEach(item => { DRINK_ITEM_CATEGORY[item.name] = cat; });
  });
  COMBO_DRINK_PRICES = {};
  const comboOpts = (OPTION_GROUPS.combo_drink && OPTION_GROUPS.combo_drink.options) || [];
  comboOpts.forEach(opt => {
    COMBO_DRINK_PRICES[opt.name] = {
      m: opt.priceM != null ? opt.priceM : null,
      l: opt.priceL != null ? opt.priceL : null,
      single: opt.price != null ? opt.price : null

  }
}

function posLocalStatusKey(cat, name) { return cat + '||' + name; }

function setPosLocalItemStatus(cat, name, status) {
  const key = posLocalStatusKey(cat, name);

  if (status === '供應中') delete posItemStatusMap[key];
  else posItemStatusMap[key] = status;
  apiPost({ action: 'setPosItemStatus', category: cat, name: name, status: status })
    .then(data => { if (data.status !== 'ok') throw new Error(data.message || '寫入失敗'); })

  const invoiceType = document.getElementById('quick-order-invoice-type').value;
  const invoiceNumberInput = document.getElementById('quick-order-invoice-number');
  const invoiceNumber = invoiceNumberInput ? invoiceNumberInput.value.trim() : '';
  if (!amount || amount <= 0) { alert('請輸入有效的金額'); return; }
  if (invoiceType !== '無統編/無載具' && !invoiceNumber) { alert('請輸入統編或手機載具號碼'); return; }
  apiPost({
    action: 'quickOrder',
    storeId: STORE_ID,
    source: source,
    totalAmount: amount,
    invoiceType: invoiceType,
    invoiceNumber: invoiceNumber
  }).then(data => {
    if (data.status !== 'ok') { alert(data.message || '出單失敗'); return; }
    alert(`已登記「${source}」訂單，訂單編號：${data.orderId}`);
    document.getElementById('quick-order-amount').value = '';
    if (invoiceNumberInput) invoiceNumberInput.value = '';
    loadQuickOrderSummary();
  });
}

// 手機直向螢幕太窄，四欄擠不下，改成一次只顯示一層（分類/品項/客製化/訂單），
// 平板橫屏(寬螢幕)則由CSS media query忽略data-step、四欄照常並排顯示
function setPosStep(step) {
  document.querySelector('.pos-layout').dataset.step = step;
  updateMobileCartBar();
}

function updateMobileCartBar() {
  const count = posCart.reduce((s, c) => s + c.qty, 0);
  const total = posCart.reduce((s, c) => s + c.qty * c.price, 0);
  document.getElementById('pos-mobile-cart-count').textContent = count;
  document.getElementById('pos-mobile-cart-total').textContent = '$' + total;
}

function goToPosCategory(i) {
  document.querySelectorAll('.pos-cat-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('pos-cat-btn-' + i).classList.add('active');

  const cat = Object.keys(CATALOG)[i];
  const itemsCol = document.getElementById('pos-col-items');
  itemsCol.innerHTML = '';
  // 切換分類時，右側客製化欄位如果還停留在上一個品項的內容要清掉，避免跟新分類的品項對不上
  document.getElementById('pos-col-detail').innerHTML = '<div class="pos-detail-empty">請選擇品項</div>';
  currentPosModal = null;
  setPosStep('items');

  const catNote = CATALOG[cat][0] && CATALOG[cat][0].note;
  if (catNote) {
    const noteEl = document.createElement('div');
    noteEl.style.cssText = 'font-size:0.78rem;color:var(--muted);margin-bottom:10px;';
    noteEl.innerHTML = catNote;
    itemsCol.appendChild(noteEl);
  }

  const grid = document.createElement('div');
  grid.className = 'pos-item-grid';
  CATALOG[cat].forEach((item, j) => {
    const key = 'c' + i + '_i' + j;
    let priceLabel = '';
    if (item.price_m && item.price_l) priceLabel = `M $${item.price_m} / L $${item.price_l}`;
    else if (item.price_m) priceLabel = `限M $${item.price_m}`;
    else if (item.price_l) priceLabel = `限L $${item.price_l}`;
    else if (item.price_alt) priceLabel = `$${item.price} / $${item.price_alt}`;
    else if (item.price_set) priceLabel = `單點 $${item.price} / 套餐 $${item.price_set}`;
    else priceLabel = `$${item.price}`;
    const card = document.createElement('div');
    card.className = 'pos-grid-card';
    card.id = 'pos-grid-card-' + key;
    // 品名本身帶空格或全形＋的（例如"韓風玫瑰醬 鳳梨雞排堡"、"定01 炒麵加蛋＋鍋貼"）在該處強制換行，
    // ＋號換行點留在前一行結尾（"...加蛋＋"）不留在下一行開頭，避免瀏覽器依字寬自動換行、每張卡片斷行點不一致看起來凌亂
    // 少數定食名稱是兩道品項名稱直接黏在一起、中間沒有空格或＋號（例如"卡拉雞腿起司巧巴達"＝卡拉雞腿+起司巧巴達"），
    // 只在卡片顯示時額外插入換行點，不改item.name本身（CATEGORY_GROUPS等處仍用原始字串當key比對，避免連動壞掉）
    // 括號附註(例如"(原/辣)")整段包成不可拆的區塊，避免被硬斷成"(原/"+"辣)"這種怪斷點
    const cardNameHtml = item.name
      .replace(/卡拉雞腿起司巧巴達/g, '卡拉雞腿<br>起司巧巴達')
      .replace(/玉米起司特酥蛋餅/g, '玉米起司<br>特酥蛋餅')
      .replace(/泡菜燒肉異國炒麵/g, '泡菜燒肉<br>異國炒麵')
      .replace(/＋/g, '＋<br>')
      .replace(/ /g, '<br>')
      .replace(/(\([^)]*\))/g, '<span style="white-space:nowrap">$1</span>');
    const localStatus = getPosLocalItemStatus(cat, item.name);
    if (localStatus) {
      card.style.opacity = '0.5';
      card.innerHTML = `<div class="name">${cardNameHtml}</div><div class="price" style="color:#A32D2D;">${localStatus === '永久下架' ? '已下架' : '本日售完'}</div>`;
    } else {
      card.innerHTML = `<div class="name">${cardNameHtml}</div><div class="price">${priceLabel}</div>`;
      card.onclick = () => openPosItemModal(cat, key, item);
    }
    grid.appendChild(card);
  });
  itemsCol.appendChild(grid);
}

// 大麥POS參考版面：點品項不跳彈窗，直接在右側「客製化」欄位就地展開

  document.querySelectorAll('.pos-grid-card').forEach(c => c.classList.remove('active'));
  const card = document.getElementById('pos-grid-card-' + key);
  if (card) card.classList.add('active');

  const detailCol = document.getElementById('pos-col-detail');

    <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
      <button type="button" onclick="closePosItemModal()" style="border:none; background:none; font-size:1.3rem; cursor:pointer; padding:0 6px 0 0; line-height:1;">←</button>
      <h2 id="pos-item-modal-title" style="margin:0; flex:1; font-size:0.95rem;"></h2>
    </div>
    <div id="pos-item-modal-size"></div>
    <div id="pos-item-modal-groups"></div>
    <label style="display:block; font-size:0.8rem; margin:10px 0 4px; color:var(--muted)">特殊需求（選填）</label>
    <textarea id="pos-item-modal-note" rows="2" style="width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:8px; font-size:0.85rem;" maxlength="100" placeholder="例如：不要洋蔥"></textarea>
    <div style="display:flex; align-items:center; justify-content:center; gap:16px; margin-top:14px;">
      <button type="button" class="qty-btn" onclick="posItemModalQty(-1)" style="width:34px;height:34px;font-size:1.2rem;">-</button>
      <span id="pos-item-modal-qty" style="font-size:1.1rem; min-width:20px; text-align:center;">1</span>
      <button type="button" class="qty-btn" onclick="posItemModalQty(1)" style="width:34px;height:34px;font-size:1.2rem;">+</button>
    </div>
    <button class="btn-primary" style="width:100%;margin-top:12px;padding:12px;" onclick="confirmAddToPosCart()">加入訂單　<span id="pos-item-modal-total"></span></button>
  `;

  let size = null, price = item.price;
  if (item.price_m && item.price_l) { size = 'M'; price = item.price_m; }
  else if (item.price_m) { size = 'M'; price = item.price_m; }
  else if (item.price_l) { size = 'L'; price = item.price_l; }

  currentPosModal = {cat, key, item, size, basePrice: price, groups: {}, qty: 1, comboDrinkName: null, comboDrinkSize: null, comboDrinkPrice: 0};

  document.getElementById('pos-item-modal-title').textContent = item.name;

  const sizeEl = document.getElementById('pos-item-modal-size');
  sizeEl.innerHTML = '';
  if (item.price_m && item.price_l) {
    sizeEl.innerHTML = `
      <div class="pos-size-select">
        <label><input type="radio" name="pos-size" value="M" autocomplete="off" checked> M $${item.price_m}</label>
        <label><input type="radio" name="pos-size" value="L" autocomplete="off"> L $${item.price_l}</label>
      </div>`;
    sizeEl.querySelectorAll('input[name="pos-size"]').forEach(r => r.onchange = (e) => {
      currentPosModal.size = e.target.value;
      currentPosModal.basePrice = e.target.value === 'M' ? item.price_m : item.price_l;
      refreshPosDrinkToppingIfPresent();
      updatePosItemModalTotal();
    });
  } else if (item.price_m || item.price_l) {
    const onlySize = item.price_m ? 'M' : 'L';
    sizeEl.innerHTML = `<div style="font-size:0.8rem;color:var(--muted);">限${onlySize} $${item.price_m || item.price_l}</div>`;
  } else if (item.price_alt) {
    const m = item.name.match(/\(([^\/]+)\/([^)]+)\)/);
    const label1 = m ? m[1] : '份量1', label2 = m ? m[2] : '份量2';
    sizeEl.innerHTML = `
      <div class="pos-size-select">
        <div style="font-size:0.8rem;color:var(--muted);margin-bottom:4px;">份量</div>
        <label><input type="radio" name="pos-qty" value="a" autocomplete="off" checked> ${label1} $${item.price}</label>
        <label><input type="radio" name="pos-qty" value="b" autocomplete="off"> ${label2} $${item.price_alt}</label>
      </div>`;
    sizeEl.querySelectorAll('input[name="pos-qty"]').forEach(r => r.onchange = (e) => {
      currentPosModal.basePrice = e.target.value === 'a' ? item.price : item.price_alt;
      updatePosItemModalTotal();
    });
  } else if (item.price_set) {
    sizeEl.innerHTML = `
      <div class="pos-size-select">
        <label><input type="radio" name="pos-setform" value="single" autocomplete="off" checked> 單點 $${item.price}</label>
        <label><input type="radio" name="pos-setform" value="set" autocomplete="off"> 套餐 $${item.price_set}</label>
      </div>`;
    sizeEl.querySelectorAll('input[name="pos-setform"]').forEach(r => r.onchange = (e) => {
      currentPosModal.basePrice = e.target.value === 'set' ? item.price_set : item.price;
      updatePosItemModalTotal();
    });
  }

  const groupsEl = document.getElementById('pos-item-modal-groups');
  groupsEl.innerHTML = '';
  // 2026-09-03改版：美1~美12的專屬醬料現在直接由groupsForCategory依品項名稱查COMBO_MAIN_SAUCE_MAP回傳，
  // 不用再另外動態切換(主餐點卡片當下就固定了，不會像以前combo_main選項那樣中途改選)
  groupsForCategory(cat, item.name).forEach(gKey => renderPosOptionGroup(groupsEl, gKey));

  const comboExtraGroups = comboOnlyGroupsFor(cat, item.name);
  if (item.price_set && comboExtraGroups.length) {
    const comboExtraEl = document.createElement('div');
    comboExtraEl.id = 'pos-combo-extra-groups';
    groupsEl.appendChild(comboExtraEl);
    const renderBundleExtras = () => {
      comboExtraEl.innerHTML = '';
      comboExtraGroups.forEach(gk => delete currentPosModal.groups[gk]);
      if (currentPosModal.basePrice === item.price_set) {
        comboExtraGroups.forEach(gk => renderPosOptionGroup(comboExtraEl, gk));
      }
      updatePosItemModalTotal();
    };
    sizeEl.querySelectorAll('input[name="pos-setform"]').forEach(r => r.addEventListener('change', renderBundleExtras));
  }

  updatePosItemModalTotal();
  setPosStep('detail');
}

// 多欄格線的選項名稱以2字一組包成不可拆的nowrap區塊，避免CJK預設逐字斷行在空間不夠時
// 斷出"不醬只"+孤字"胡"這種難看的斷點；同時不強制整個名稱nowrap，短名稱仍可整行顯示，
// 真的空間不夠需要換行時也只會斷在區塊之間，不會撐爆grid欄寬（跟強制nowrap相比不會溢出容器）
function chunkNameForWrap(name) {
  const chars = [...name];
  let out = '';
  for (let i = 0; i < chars.length; i += 2) {
    out += `<span style="white-space:nowrap">${chars.slice(i, i + 2).join('')}</span>`;
  }
  return out;
}

function renderPosOptionGroup(container, gKey) {
  const g = OPTION_GROUPS[gKey];
  currentPosModal.groups[gKey] = [];
  const wrap = document.createElement('div');
  wrap.style.marginTop = '12px';
  if (gKey === 'drink_topping') wrap.id = 'pos-option-group-drink_topping';
  wrap.innerHTML = `<div style="font-size:0.85rem;color:var(--muted);margin-bottom:4px;">${g.label}${g.required ? ' <span style=\"color:#c94f1f\">*必選</span>' : ''}</div>`;
  const optWrap = document.createElement('div');
  const sizeForFilter = (currentPosModal.comboDrinkSize != null && currentPosModal.comboDrinkSize !== '') ? currentPosModal.comboDrinkSize.toUpperCase() : currentPosModal.size;
  const visibleOptions = g.options.filter(opt => {
    if (opt.priceM === undefined && opt.priceL === undefined) return true;
    if (sizeForFilter === 'M') return opt.priceM != null;
    if (sizeForFilter === 'L') return opt.priceL != null;
    return true;
  });
  // 老闆反饋(2026-08-31)：欄數依名稱長度動態判斷會讓不同品項的客製化選單忽1忽2忽3欄、看起來跳來跳去，
  // 且醬料類群組固定3欄時，混進4個字的長選項（如"不醬只胡"）會被拆成2行跟旁邊1行的選項對不齊。
  // 改為固定二選一：加料類(選項多但單項短，價格常換行顯示)維持單欄；其餘一律固定2欄，不再依名稱長度或群組類型跳欄數
  // deluxe_upgrade例外：選項本身是完整餐點敘述，2欄會硬拆成2行，維持單欄
  const OPTION_GROUP_COLUMNS = {
    bread_addon: 1, noodle_addon: 1, dine_set_addon: 1, omelet_addon: 1, jam_bread_choice: 1,
    omelet_choice: 1, drink_topping: 1, small_drink: 1, deluxe_upgrade: 1
  };
  const cols = OPTION_GROUP_COLUMNS[gKey] || 2;
  // minmax(0,1fr)而非單純1fr：避免nowrap選項的內容最小寬度把某欄擠得比平分寬度還大，導致整個grid溢出容器
  optWrap.style.cssText = cols === 1 ? 'display:block;' : `display:grid;grid-template-columns:repeat(${cols}, minmax(0, 1fr));gap:4px 10px;`;
  wrap.appendChild(optWrap);
  const groupName = 'pos_' + gKey;
  visibleOptions.forEach((opt) => {
    const id = groupName + '_' + opt.name;
    const label = document.createElement('label');
    // 欄位間距已經靠grid的column-gap處理，label自己的右margin是舊版inline-block排版留下來的多餘空間，
    // 3欄較窄時會白白吃掉每欄的可用寬度，改成靠grid gap本身留白即可，不再額外加margin-right
    label.style.cssText = cols === 1 ? 'display:block;margin:2px 0;font-size:0.82rem;' : 'display:inline-block;min-width:0;max-width:100%;margin:2px 0;font-size:0.82rem;';
    const inputType = g.type === 'single' ? 'radio' : 'checkbox';
    const autoCheck = g.required && g.type === 'single' && g.options.length === 1;
    // 多欄排版時名稱以2字為單位包成不可拆的區塊，換行只會發生在區塊之間，不會斷出單一孤字的難看斷點
    const displayName = cols === 1 ? opt.name : chunkNameForWrap(opt.name);
    // 客製化選項本身也可能被登記在ITEM_LIST的「品項上下架」清單裡(例如加起司、茶珠)，
    // 用同一份本機狀態擋掉不能選，跟品項上下架管理清單(渲染自ITEM_LIST)的分類key保持一致
    const unavailStatus = POS_LOCAL_ADDON_STATUS_NAMES.has(opt.name) ? getPosLocalItemStatus(POS_LOCAL_ADDON_STATUS_CATEGORY, opt.name) : null;
    if (unavailStatus) label.style.opacity = '0.5';
    const unavailLabel = unavailStatus ? `<span style="color:#A32D2D;font-size:0.72rem;">（${unavailStatus === '永久下架' ? '已下架' : '本日售完'}）</span>` : '';
    if (opt.priceM != null || opt.priceL != null) {
      const sizeParts = [];
      if (opt.priceM != null) sizeParts.push(`M +$${opt.priceM}`);
      if (opt.priceL != null) sizeParts.push(`L +$${opt.priceL}`);
      label.innerHTML = `<input type="${inputType}" name="${groupName}" value="${opt.name}" id="${id}" autocomplete="off" ${autoCheck ? 'checked' : ''} ${unavailStatus ? 'disabled' : ''}> ${displayName}${unavailLabel}<br><span style="margin-left:20px;color:var(--muted);font-size:0.76rem;">${sizeParts.join('　')}</span>`;
    } else {
      const priceLabel = opt.price ? (opt.price > 0 ? ' +$' + opt.price : ' -$' + Math.abs(opt.price)) : '';
      label.innerHTML = `<input type="${inputType}" name="${groupName}" value="${opt.name}" id="${id}" autocomplete="off" ${autoCheck ? 'checked' : ''} ${unavailStatus ? 'disabled' : ''}> ${displayName}${priceLabel}${unavailLabel}`;
    }
    optWrap.appendChild(label);
    if (autoCheck && !unavailStatus) currentPosModal.groups[gKey] = [opt.name];
  });
  container.appendChild(wrap);
  wrap.querySelectorAll('input').forEach(inp => {
    if (g.type === 'single') {
      inp.addEventListener('mousedown', () => { inp.dataset.wasChecked = inp.checked ? '1' : ''; });
      inp.addEventListener('click', (e) => {
        if (inp.dataset.wasChecked === '1') {
          e.preventDefault();
          setTimeout(() => {
            inp.checked = false;
            currentPosModal.groups[gKey] = [];
            if (gKey === 'combo_drink' || gKey === 'small_drink') clearPosDrinkCustom();
            updatePosItemModalTotal();
          }, 0);
        }
      });
    }
    inp.onchange = () => {
      if (g.type === 'single') {
        currentPosModal.groups[gKey] = inp.checked ? [inp.value] : [];
      } else {
        if (inp.checked) currentPosModal.groups[gKey].push(inp.value);
        else currentPosModal.groups[gKey] = currentPosModal.groups[gKey].filter(v => v !== inp.value);
      }
      if (gKey === 'combo_drink') {
        if (inp.checked) openPosDrinkCustom(inp.value);
        else clearPosDrinkCustom();
      } else if (gKey === 'small_drink') {
        if (inp.checked) openPosSmallDrinkCustom(inp.value);
        else clearPosDrinkCustom();
      }
      updatePosItemModalTotal();
    };
  });
}

function refreshPosDrinkToppingIfPresent() {
  const old = document.getElementById('pos-option-group-drink_topping');
  if (!old) return;
  const container = old.parentElement;
  old.remove();
  renderPosOptionGroup(container, 'drink_topping');
}

function clearPosDrinkCustom() {
  currentPosModal.comboDrinkName = null;
  currentPosModal.comboDrinkSize = null;
  currentPosModal.comboDrinkPrice = 0;
  (currentPosModal.comboDrinkExtraGroups || []).forEach(gk => delete currentPosModal.groups[gk]);
  currentPosModal.comboDrinkExtraGroups = [];
}

function openPosDrinkCustom(drinkName) {
  clearPosDrinkCustom();
  currentPosModal.activeDrinkGroupKey = 'combo_drink';
  currentPosModal.comboDrinkName = drinkName;
  const prices = COMBO_DRINK_PRICES[drinkName];
  document.getElementById('pos-drink-modal-title').textContent = drinkName;
  const body = document.getElementById('pos-drink-modal-body');
  body.innerHTML = '';
  if (!prices) { document.getElementById('pos-drink-overlay').classList.add('open'); return; }

  const sizeEl = document.createElement('div');
  sizeEl.style.marginBottom = '10px';
  body.appendChild(sizeEl);
  const availSizes = ['m', 'l'].filter(sz => prices[sz] != null);
  if (prices.single != null || availSizes.length === 1) {
    const only = prices.single != null ? prices.single : prices[availSizes[0]];
    currentPosModal.comboDrinkSize = prices.single != null ? '' : availSizes[0];
    currentPosModal.comboDrinkPrice = only;
    const sizeLabel = prices.single != null ? '' : `限${availSizes[0].toUpperCase()} `;
    sizeEl.innerHTML = `<div style="font-size:0.8rem;color:var(--muted);">${sizeLabel}+$${only}</div>`;
  } else {
    sizeEl.innerHTML = `<div style="font-size:0.8rem;color:var(--muted);margin-bottom:4px;">份量 <span style="color:#c94f1f">*必選</span></div>`;
    ['m', 'l'].forEach(sz => {
      if (prices[sz] == null) return;
      const label = document.createElement('label');
      label.style.cssText = 'display:inline-block;margin:2px 10px 2px 0;font-size:0.82rem;';
      label.innerHTML = `<input type="radio" name="pos_combo_drink_size" value="${sz}" autocomplete="off"> ${sz.toUpperCase()} +$${prices[sz]}`;
      sizeEl.appendChild(label);
    });
    sizeEl.querySelectorAll('input').forEach(inp => {
      inp.onchange = () => {
        currentPosModal.comboDrinkSize = inp.value;
        currentPosModal.comboDrinkPrice = prices[inp.value];
        refreshPosDrinkToppingIfPresent();
        updatePosItemModalTotal();
      };
    });
  }

  const extraGroups = drinkGroupsFor(drinkName);
  currentPosModal.comboDrinkExtraGroups = extraGroups;
  extraGroups.forEach(gk => renderPosOptionGroup(body, gk));

  updatePosItemModalTotal();
  document.getElementById('pos-drink-overlay').classList.add('open');
}

function openPosSmallDrinkCustom(drinkName) {
  clearPosDrinkCustom();
  currentPosModal.activeDrinkGroupKey = 'small_drink';
  currentPosModal.comboDrinkName = drinkName;
  currentPosModal.comboDrinkSize = drinkName.includes('大杯') ? 'l' : 'm';
  currentPosModal.comboDrinkPrice = 0;
  document.getElementById('pos-drink-modal-title').textContent = drinkName;
  const body = document.getElementById('pos-drink-modal-body');
  body.innerHTML = '';
  const extraGroups = ['temperature_choice', 'sweetness', 'drink_topping'];
  currentPosModal.comboDrinkExtraGroups = extraGroups;
  extraGroups.forEach(gk => renderPosOptionGroup(body, gk));
  updatePosItemModalTotal();
  document.getElementById('pos-drink-overlay').classList.add('open');
}

function confirmPosDrinkCustom() {
  const prices = COMBO_DRINK_PRICES[currentPosModal.comboDrinkName];
  if (prices && prices.single == null && !currentPosModal.comboDrinkSize) {
    alert('請選擇飲料的「份量」（M/L）');
    return;
  }
  for (const gk of (currentPosModal.comboDrinkExtraGroups || [])) {
    const g = OPTION_GROUPS[gk];
    if (g.required && (!currentPosModal.groups[gk] || !currentPosModal.groups[gk].length)) {
      alert('請選擇飲料的「' + g.label + '」');
      return;
    }
  }
  document.getElementById('pos-drink-overlay').classList.remove('open');
  updatePosItemModalTotal();
}

function cancelPosDrinkCustom() {
  const gk = currentPosModal.activeDrinkGroupKey || 'combo_drink';
  clearPosDrinkCustom();
  currentPosModal.groups[gk] = [];
  document.querySelectorAll(`input[name="pos_${gk}"]`).forEach(r => { r.checked = false; });
  document.getElementById('pos-drink-overlay').classList.remove('open');
  updatePosItemModalTotal();
}

function posItemModalQty(delta) {
  if (!currentPosModal) return;
  currentPosModal.qty = Math.max(1, currentPosModal.qty + delta);
  document.getElementById('pos-item-modal-qty').textContent = currentPosModal.qty;
  updatePosItemModalTotal();
}

function calcPosModalUnitPrice() {
  if (!currentPosModal) return 0;
  let price = currentPosModal.basePrice;
  Object.keys(currentPosModal.groups).forEach(gKey => {
    const g = OPTION_GROUPS[gKey];
    currentPosModal.groups[gKey].forEach(name => {
      const opt = g.options.find(o => o.name === name);
      if (!opt) return;
      if (opt.priceM != null) {
        const sizeForPricing = (currentPosModal.comboDrinkSize != null && currentPosModal.comboDrinkSize !== '') ? currentPosModal.comboDrinkSize.toUpperCase() : currentPosModal.size;
        price += (sizeForPricing === 'L' ? opt.priceL : opt.priceM);
      }
      else price += opt.price;
    });
  });
  price += currentPosModal.comboDrinkPrice || 0;
  return price;
}

function updatePosItemModalTotal() {
  if (!currentPosModal) return;
  const unit = calcPosModalUnitPrice();
  document.getElementById('pos-item-modal-total').textContent = '$' + (unit * currentPosModal.qty);
}

function closePosItemModal() {
  document.querySelectorAll('.pos-grid-card').forEach(c => c.classList.remove('active'));
  document.getElementById('pos-col-detail').innerHTML = '<div class="pos-detail-empty">請選擇品項</div>';
  currentPosModal = null;
  setPosStep('items');
}

function confirmAddToPosCart() {
  if (!currentPosModal) return;
  for (const gKey of groupsForCategory(currentPosModal.cat, currentPosModal.item.name)) {
    const g = OPTION_GROUPS[gKey];
    if (g.required && (!currentPosModal.groups[gKey] || currentPosModal.groups[gKey].length === 0)) {
      alert('請選擇「' + g.label.replace('*必選','') + '」');
      return;
    }
    if (gKey === 'combo_drink' && currentPosModal.groups[gKey].length) {
      const prices = COMBO_DRINK_PRICES[currentPosModal.groups[gKey][0]];
      if (prices && prices.single == null && !currentPosModal.comboDrinkSize) {
        alert('請選擇飲料的「份量」（M/L）');
        return;
      }
      for (const dgk of (currentPosModal.comboDrinkExtraGroups || [])) {
        const dg = OPTION_GROUPS[dgk];
        if (dg.required && (!currentPosModal.groups[dgk] || !currentPosModal.groups[dgk].length)) {
          alert('請選擇飲料的「' + dg.label + '」');
          return;
        }
      }
    }
  }
  const comboExtraGroupsForConfirm = comboOnlyGroupsFor(currentPosModal.cat, currentPosModal.item.name);
  if (currentPosModal.item.price_set && comboExtraGroupsForConfirm.length && currentPosModal.basePrice === currentPosModal.item.price_set) {
    for (const gk of comboExtraGroupsForConfirm) {
      if (!currentPosModal.groups[gk] || !currentPosModal.groups[gk].length) {
        alert('請選擇「' + OPTION_GROUPS[gk].label + '」');
        return;
      }
      if (gk === 'small_drink') {
        for (const dgk of (currentPosModal.comboDrinkExtraGroups || [])) {
          const dg = OPTION_GROUPS[dgk];
          if (dg.required && (!currentPosModal.groups[dgk] || !currentPosModal.groups[dgk].length)) {
            alert('請選擇飲料的「' + dg.label + '」');
            return;
          }
        }
      }
    }
  }
  const note = document.getElementById('pos-item-modal-note').value.trim();
  const unit = calcPosModalUnitPrice();
  const optionParts = [];
  Object.keys(currentPosModal.groups).forEach(gKey => {
    if (!currentPosModal.groups[gKey].length) return;
    if (gKey === 'combo_drink' && currentPosModal.comboDrinkSize) {
      optionParts.push(currentPosModal.groups[gKey][0] + ' ' + currentPosModal.comboDrinkSize.toUpperCase());
    } else {
      optionParts.push(currentPosModal.groups[gKey].join('/'));
    }
  });
  const lineKey = currentPosModal.key + (currentPosModal.size || '') + '|' + optionParts.join(',') + '|' + note;
  const displayName = currentPosModal.item.name + (optionParts.length ? '（' + optionParts.join('、') + '）' : '');

  const existing = posCart.find(c => c.lineKey === lineKey);
  if (existing) existing.qty += currentPosModal.qty;
  // baseName/basePrice供「第二件六折」等折抵套用：baseName不含客製化(用來跨列合併同品項數量判斷資格)，
  // basePrice是客人選單點或升級套餐當下的整組價(客製化加價之前)，折抵只算這個金額，加購一律不打折
  else posCart.push({lineKey, name: displayName, baseName: currentPosModal.item.name, size: currentPosModal.size, price: unit, basePrice: currentPosModal.basePrice, qty: currentPosModal.qty, note});
  closePosItemModal();
  renderPosCart();
}

function renderPosCart() {
  const linesEl = document.getElementById('pos-cart-lines');
  linesEl.innerHTML = '';
  if (posCart.length === 0) {
    linesEl.innerHTML = '<div class="pos-empty-cart">尚未選購品項</div>';
  }
  posCart.forEach(c => {
    const div = document.createElement('div');
    div.className = 'pos-cart-line';
    div.innerHTML = `
      <div>${c.name}${c.size ? ' ('+c.size+')' : ''}${c.note ? '<br><span style=\"color:var(--muted);font-size:0.78rem\">備註：'+c.note+'</span>' : ''}<br><span style="color:var(--muted);font-size:0.8rem">$${c.price} x ${c.qty}</span></div>
      <div style="display:flex;align-items:center;gap:8px">
        <button class="qty-btn" data-act="dec">-</button>
        <span>${c.qty}</span>
        <button class="qty-btn" data-act="inc">+</button>
      </div>
    `;
    div.querySelector('[data-act="dec"]').onclick = () => changePosQty(c.lineKey, -1);
    div.querySelector('[data-act="inc"]').onclick = () => changePosQty(c.lineKey, 1);
    linesEl.appendChild(div);
  });
  const voucherEl = document.getElementById('pos-cart-voucher');
  if (voucherEl) {
    voucherEl.innerHTML = appliedVouchers.map(v => `
      <div style="display:flex;align-items:center;justify-content:space-between;font-size:0.8rem;color:var(--brand);padding:4px 0;">
        <span>已套用兌換券：${v.type} -$${v.discountAmount}</span>
        <button class="btn" style="padding:2px 7px;font-size:0.72rem;" onclick="clearAppliedVoucher('${v.voucherId}')">取消</button>
      </div>`).join('');
  }
  const directEl = document.getElementById('pos-cart-direct-discount');
  if (directEl) {
    directEl.innerHTML = directDiscounts.map((d, i) => `
      <div style="display:flex;align-items:center;justify-content:space-between;font-size:0.8rem;color:var(--brand);padding:4px 0;">
        <span>門市活動：${d.type} ${d.discountAmount >= 0 ? '-' : '+'}$${Math.abs(d.discountAmount)}</span>
        <button class="btn" style="padding:2px 7px;font-size:0.72rem;" onclick="clearDirectDiscount(${i})">取消</button>
      </div>`).join('');
  }
  document.getElementById('pos-cart-total').textContent = '$' + getPosCartFinalTotal();
  updateMobileCartBar();
}

// 購物車原始總額扣掉本次套用的所有兌換券+門市活動折抵金額加總(可複選多筆)，下限為$0
function getPosCartFinalTotal() {
  const rawTotal = posCart.reduce((s, c) => s + c.qty * c.price, 0);
  const discount = appliedVouchers.reduce((s, v) => s + v.discountAmount, 0)
    + directDiscounts.reduce((s, d) => s + d.discountAmount, 0);
  return Math.max(0, rawTotal - discount);
}

function changePosQty(lineKey, delta) {
  const idx = posCart.findIndex(c => c.lineKey === lineKey);
  if (idx === -1) return;
  posCart[idx].qty += delta;
  if (posCart[idx].qty <= 0) posCart.splice(idx, 1);
  renderPosCart();
}

// 大麥POS參考版面：訂單/結帳固定顯示在右側第四欄，不用彈窗打開/關閉
function showPosCheckout() {
  if (posCart.length === 0) { alert('請先選購品項'); return; }
  const total = getPosCartFinalTotal();
  document.getElementById('pos-checkout-member').textContent = selectedMember
    ? `已選會員：${selectedMember.name}（${selectedMember.tier}，本次預估可得 ${Math.floor(total / 100) * (MEMBER_TIER_MULTIPLIER[selectedMember.tier] || 1)} 點）`
    : '未選會員（不累計點數）';
  document.getElementById('pos-checkout-btn').style.display = 'none';
  document.getElementById('pos-checkout-panel').style.display = 'block';
}
function backToPosCart() {
  document.getElementById('pos-checkout-panel').style.display = 'none';
  document.getElementById('pos-checkout-btn').style.display = 'block';
}
function closePosCartAll() {
  posCart = [];
  memberVouchers = [];
  appliedVouchers = [];
  pendingVoucherForItemPick = null;
  directDiscounts = [];
  pendingDirectDiscount = null;
  renderPosCart();
  document.getElementById('member-phone-input').value = '';
  document.getElementById('member-info').innerHTML = '';
  selectedMember = null;
  document.getElementById('pos-confirm-panel').style.display = 'none';
  document.getElementById('pos-checkout-btn').style.display = 'block';
  setPosStep('categories');
}

function submitPosOrder() {
  const total = getPosCartFinalTotal();
  const items = posCart.map(c => ({ name: c.name, size: c.size || '', qty: c.qty, price: c.price }));
  const paymentMethod = document.getElementById('pos-payment-method').value;
  apiPost({
    action: 'posCheckout',
    storeId: STORE_ID,
    items: items,
    totalAmount: total,
    paymentMethod: paymentMethod,
    memberPhone: selectedMember ? selectedMember.phone : '',
    voucherIds: appliedVouchers.map(v => v.voucherId)
  }).then(data => {
    if (data.status !== 'ok') { alert(data.message || '結帳失敗'); return; }
    document.getElementById('pos-confirm-order-no').textContent = data.orderId;
    document.getElementById('pos-confirm-points').textContent = data.pointsEarned ? `本次消費獲得 ${data.pointsEarned} 點` : '';
    document.getElementById('pos-checkout-panel').style.display = 'none';
    document.getElementById('pos-confirm-panel').style.display = 'block';
    loadRevenue();
  });
}
</script>
