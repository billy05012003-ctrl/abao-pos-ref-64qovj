<!DOCTYPE html>
<html lang="zh-Hant">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>診斷：Fully Kiosk API</title>
<style>body{font:16px/1.6 monospace;padding:16px;background:#111;color:#0f0;white-space:pre-wrap;word-break:break-all}</style>
</head>
<body id="out">載入中…</body>
<script>
function report() {
  var out = document.getElementById('out');
  var lines = [];
  if (typeof window.fully === 'undefined') {
    lines.push('❌ 找不到 window.fully，代表：');
    lines.push('  1) 不是用 Fully Kiosk Browser 開這頁，或');
    lines.push('  2) App設定裡「Enable JavaScript Interface」還沒開');
  } else {
    lines.push('✅ 找到 window.fully，共有以下屬性/函式：');
    var keys = [];
    for (var k in window.fully) keys.push(k);
    keys.sort();
    var bt = keys.filter(function(k){ return /blue|print|bt/i.test(k); });
    lines.push('');
    lines.push('--- 跟藍牙/列印相關的（優先看這些）---');
    lines.push(bt.length ? bt.join('\n') : '(沒有符合的名稱)');
    lines.push('');
    lines.push('--- 全部(' + keys.length + '個) ---');
    lines.push(keys.join('\n'));
  }
  out.textContent = lines.join('\n');
}
if (document.readyState === 'complete') report(); else window.addEventListener('load', report);
</script>
</body>
</html>
